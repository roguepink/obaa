function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function proj(wx, z) {               // 世界の位置 → 画面の位置と大きさ
  var s = CONFIG.D / (CONFIG.D + Math.max(z, -CONFIG.D * 0.7));

}
var EC = {};
function emoCanvas(ch) {             // 絵文字は1回だけ描いて覚えておく(速くするため)
  var c = EC[ch];
  if (!c) {
    c = document.createElement('canvas'); c.width = c.height = 120;
    var x = c.getContext('2d'); x.font = '96px ' + EMOJI_FONT; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillText(ch, 60, 66); EC[ch] = c;
  }

}
function emo(ch, x, y, size, rot, alpha) {
  if (!ch) return;
  var c = emoCanvas(ch);
  ctx.save(); ctx.translate(x, y); if (rot) ctx.rotate(rot); if (alpha != null) ctx.globalAlpha = alpha;
  ctx.drawImage(c, -size * 0.625, -size * 0.625, size * 1.25, size * 1.25); ctx.restore();
}
function txt(s, x, y, size, col, stroke, align) {
  ctx.font = '900 ' + size + 'px ' + FONT; ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(3, size / 5); ctx.strokeStyle = stroke || '#1b1430';
  ctx.strokeText(s, x, y); ctx.fillStyle = col || '#fff'; ctx.fillText(s, x, y);
}
function shadow(x, y, rx, ry, a) {
  ctx.fillStyle = 'rgba(0,0,0,' + (a || 0.28) + ')'; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, 6.283); ctx.fill();
}
function rrect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function bubble(s, x, y, size) {
  ctx.font = '800 ' + size + 'px ' + FONT;
  var w = ctx.measureText(s).width + size * 0.9, h = size * 1.6;
  ctx.fillStyle = 'rgba(255,255,255,.92)'; rrect(x - w / 2, y - h / 2, w, h, h / 2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x - 4, y + h / 2 - 1); ctx.lineTo(x + 4, y + h / 2 - 1); ctx.lineTo(x, y + h / 2 + 6); ctx.fill();
  ctx.fillStyle = '#222'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(s, x, y + 1);
}

/* ===== 音(外のファイルは使わず その場で作る) ===== */
var AU = { c: null, m: null, muted: false, nextT: 0, step: 0, nb: null };
try { AU.muted = localStorage.getItem(CONFIG.MUTE_KEY) === '1'; } catch (e) {}
function auInit() {
  if (AU.c) { if (AU.c.state === 'suspended') AU.c.resume(); return; }
  try {
    var C = window.AudioContext || window.webkitAudioContext; AU.c = new C();
    AU.m = AU.c.createGain(); AU.m.gain.value = AU.muted ? 0 : 0.55; AU.m.connect(AU.c.destination);
    var len = AU.c.sampleRate * 0.5, b = AU.c.createBuffer(1, len, AU.c.sampleRate), d = b.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    AU.nb = b; AU.nextT = AU.c.currentTime + 0.1;
    setInterval(bgmTick, 60);
  } catch (e) { AU.c = null; }
}
function tone(f, t, dur, type, vol, f2) {
  var o = AU.c.createOscillator(), g = AU.c.createGain();
  o.type = type || 'square'; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol || 0.1, t); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  o.connect(g); g.connect(AU.m); o.start(t); o.stop(t + dur + 0.03);
}
function noise(t, dur, vol, freq) {
  var s = AU.c.createBufferSource(), f = AU.c.createBiquadFilter(), g = AU.c.createGain();
  s.buffer = AU.nb; f.type = 'bandpass'; f.frequency.value = freq || 1200; f.Q.value = 0.8;
  g.gain.setValueAtTime(vol || 0.2, t); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  s.connect(f); f.connect(g); g.connect(AU.m); s.start(t); s.stop(t + dur + 0.03);
}
function sfx(n) {
  if (!AU.c || AU.muted) return;
  var t = AU.c.currentTime;
  try {
    if (n === 'hit') { noise(t, 0.12, 0.45, 1800); tone(rnd(500, 700), t, 0.12, 'square', 0.12, 120); }
    else if (n === 'bonk') { noise(t, 0.08, 0.3, 900); tone(300, t, 0.08, 'triangle', 0.12, 150); }
    else if (n === 'swing') { noise(t, 0.12, 0.12, 3000); }
    else if (n === 'jump') { tone(330, t, 0.18, 'square', 0.08, 880); }
    else if (n === 'boss') { noise(t, 0.2, 0.5, 600); tone(160, t, 0.25, 'sawtooth', 0.15, 60); }
    else if (n === 'kira') { tone(1568, t, 0.12, 'sine', 0.06); tone(2093, t + 0.06, 0.18, 'sine', 0.05); }
    else if (n === 'sp') {
      [523, 659, 784, 1047, 1319].forEach(function (f, i) { tone(f, t + i * 0.06, 0.4, 'square', 0.07); });
      noise(t + 0.75, 0.9, 0.7, 400); tone(90, t + 0.75, 0.9, 'sawtooth', 0.25, 30);
    }
    else if (n === 'trip') { tone(600, t, 0.5, 'square', 0.12, 80); noise(t + 0.35, 0.3, 0.5, 300); }
    else if (n === 'clear') { [523, 659, 784, 1047, 784, 1047].forEach(function (f, i) { tone(f, t + i * 0.1, 0.25, 'square', 0.08); }); }
    else if (n === 'warn') { for (var i = 0; i < 4; i++) tone(i % 2 ? 440 : 330, t + i * 0.18, 0.16, 'sawtooth', 0.08); }
  } catch (e) {}
}
function bgmTick() {                 // ノリのいい いつもの曲(遊んでいるときだけ鳴る)
  if (!AU.c || AU.muted) return;
  var now = AU.c.currentTime;
  if (AU.nextT < now) AU.nextT = now + 0.05;
  if (G.state !== 'play' || G.paused) return;
  var boss = G.phase === 'boss';
  var stp = boss ? 0.105 : 0.125;
  var key = [0, 2, 5, 7, 3, 9, 5, 0, 8, 11][G.stage % 10];
  var prog = boss ? [0, -4, -2, -5] : [0, -3, 5, 7];
  var scale = boss ? [0, 3, 5, 7, 10, 12] : [0, 2, 4, 7, 9, 12];
  while (AU.nextT < now + 0.2) {
    var s = AU.step % 16, bar = Math.floor(AU.step / 16) % 4, root = 110 * Math.pow(2, (key + prog[bar]) / 12), t = AU.nextT;
    try {
      if (s % 2 === 0) tone(root * (s % 4 === 0 ? 1 : 2), t, stp * 1.6, 'triangle', 0.09);
      if (s % 4 === 0) { tone(120, t, 0.12, 'sine', 0.22, 40); }
      if (s % 8 === 4) noise(t, 0.08, 0.12, 2500);
      if (s % 2 === 1) noise(t, 0.03, 0.04, 7000);
      var mel = [0, 2, 4, 5, 4, 2, 3, 1, 0, 2, 4, 5, 5, 4, 3, 2];
      if ((s + bar) % 3 !== 2) tone(root * 4 * Math.pow(2, scale[(mel[s] + bar) % scale.length] / 12), t, stp * 0.9, 'square', 0.025);
    } catch (e) {}
    AU.nextT += stp; AU.step++;
  }
}
function setMute(m) {
  AU.muted = m; try { localStorage.setItem(CONFIG.MUTE_KEY, m ? '1' : '0'); } catch (e) {}
  if (AU.m) AU.m.gain.value = m ? 0 : 0.55;
  document.getElementById('bMute').textContent = m ? '🔇' : '🔊';
}

/* ===== ゲームの始まり ===== */
function hashOpt(k) { var m = location.hash.match(new RegExp('[#&]' + k + '(?:=(\\d+))?(?:&|$)')); return m ? (m[1] != null ? +m[1] : true) : null; }
function reset() {
  G.score = 0; G.t = 0; G.dist = 0; G.stage = 0; G.loop = 0; G.phase = 'run'; G.phaseT = 0;
  G.px = 0; G.jh = 0; G.vy = 0; G.atkT = 0; G.atkCd = 0; G.combo = 0; G.comboT = 0; G.maxCombo = 0; G.gauge = 0;
  G.objs = []; G.fly = []; G.fx = []; G.boss = null; G.sp = null; G.lastSp = -1; G.inv = 0;
  G.foeT = 1.2; G.hazT = 3.5; G.decoD = 0; G.hitstop = 0; G.shake = 0; G.flash = 0; G.banner = null; G.scoldT = 0; G.say = null;
  G.trip = null; G.killed = 0; G.city = makeCity();
  var st = hashOpt('stage'); if (st) { G.stage = clamp(st - 1, 0, 9); G.city = makeCity(); }
  if (hashOpt('boss')) G.phaseT = CONFIG.STAGE_TIME - 0.5;
  if (hashOpt('full')) G.gauge = CONFIG.GAUGE_MAX;
  stageBanner();
}
function start(ev) {
  auInit();
  reset(); G.state = 'play'; G.paused = false;
  ['title', 'over', 'pause'].forEach(function (id) { document.getElementById(id).classList.add('hidden'); });
  document.getElementById('pad').classList.remove('hidden'); document.getElementById('tools').classList.remove('hidden');
  if (ev && ev.isTrusted) try {
    var el = document.documentElement, fs = el.requestFullscreen || el.webkitRequestFullscreen;
    var pr = fs && fs.call(el);
    if (pr && pr.catch) pr.catch(function () {});
  } catch (e) {}
}
function finish() {
  G.state = 'over';
  var stNo = G.loop * 10 + G.stage + 1;
  if (G.score > G.best) { G.best = G.score; try { localStorage.setItem(CONFIG.BEST_KEY, String(G.best)); } catch (e) {} }
  if (stNo > G.bestStage) { G.bestStage = stNo; try { localStorage.setItem(CONFIG.STAGE_KEY, String(stNo)); } catch (e) {} }
  showBest();
  var S = STAGES[G.stage];
  document.getElementById('overWhy').textContent = (G.trip ? G.trip.n : '小石') + 'につまずいた…(STAGE ' + stNo + ' ' + S.title + ')';
  document.getElementById('overScore').textContent = 'スコア ' + G.score + ' / こらしめた数 ' + G.killed + ' / 最大 ' + G.maxCombo + ' れんぞく' +
    (G.best ? '　ベスト ' + G.best : '');
  document.getElementById('over').classList.remove('hidden');
  document.getElementById('pad').classList.add('hidden'); document.getElementById('tools').classList.add('hidden');
}
function setPause(p) {
  if (G.state !== 'play') return;
  G.paused = p; document.getElementById('pause').classList.toggle('hidden', !p);
}

/* ===== 入力: 左右になぞる・ジャンプ・杖・必殺 ===== */
var drag = {};
function lx(ev) { var r = cv.getBoundingClientRect(); return (ev.clientX - r.left) / (r.width / (cv.width / SC)) - OX; }
cv.addEventListener('pointerdown', function (ev) { drag[ev.pointerId] = lx(ev); try { cv.setPointerCapture(ev.pointerId); } catch (e) {} });
cv.addEventListener('pointermove', function (ev) {
  if (drag[ev.pointerId] == null || G.state !== 'play' || G.paused) return;
  var x = lx(ev); G.px = clamp(G.px + (x - drag[ev.pointerId]) / CONFIG.ROADW * 1.35, -0.88, 0.88); drag[ev.pointerId] = x;
});
['pointerup', 'pointercancel'].forEach(function (n) { cv.addEventListener(n, function (ev) { delete drag[ev.pointerId]; }); });
function bindBtn(id, fn) {
  var b = document.getElementById(id);
  b.addEventListener('pointerdown', function (ev) { ev.preventDefault(); b.classList.add('on'); fn(); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (n) { b.addEventListener(n, function () { b.classList.remove('on'); }); });
  b.addEventListener('click', function () { b.blur(); });
}
bindBtn('bJump', function () { doJump(); });
bindBtn('bAtk', function () { doAttack(); });
bindBtn('bSp', function () { doSpecial(); });
var keys = {};
addEventListener('keydown', function (ev) {
  keys[ev.key] = true;
  if (G.state !== 'play') { if ((ev.key === 'Enter' || ev.key === ' ') && G.state !== 'trip') start(); return; }
  if (ev.key === ' ' || ev.key === 'ArrowUp' || ev.key === 'w') { doJump(); ev.preventDefault(); }
  if (ev.key === 'z' || ev.key === 'x' || ev.key === 'j') doAttack();
  if (ev.key === 'c' || ev.key === 'k') doSpecial();
  if (ev.key === 'p' || ev.key === 'Escape') setPause(!G.paused);
});
addEventListener('keyup', function (ev) { keys[ev.key] = false; });
document.getElementById('btnPlay').addEventListener('click', function (ev) { this.blur(); start(ev); });
document.getElementById('btnAgain').addEventListener('click', function (ev) { this.blur(); start(ev); });
document.getElementById('btnResume').addEventListener('click', function () { this.blur(); setPause(false); auInit(); });
document.getElementById('bPause').addEventListener('click', function () { this.blur(); setPause(true); });
document.getElementById('bMute').addEventListener('click', function () { this.blur(); auInit(); setMute(!AU.muted); });
setMute(AU.muted);
document.addEventListener('visibilitychange', function () { if (document.hidden) setPause(true); });

function doJump() {
  if (G.state !== 'play' || G.paused || G.jh > 0.5) return;
  G.vy = CONFIG.JUMP; G.jh = 1; sfx('jump');
}
function doAttack() {
  if (G.state !== 'play' || G.paused || G.atkCd > 0) return;
  G.atkT = 0.24; G.atkCd = 0.16; sfx('swing');
  var hit = 0;
  G.objs.forEach(function (o) {
    if (o.k === 'foe' && !o.dead && o.z > -25 && o.z < CONFIG.ATK_REACH && Math.abs(o.wx - G.px) < CONFIG.ATK_WIDE) { knock(o, true); hit++; }
  });
  var b = G.boss;
  if (b && !b.dying && b.in && b.z < 175 && Math.abs(b.wx - G.px) < 0.7) { hitBoss(1); hit++; }
  if (hit) { G.hitstop = Math.min(0.09, 0.035 + hit * 0.012); if (Math.random() < 0.45) scold(); }
}
function doSpecial() {
  if (G.state !== 'play' || G.paused || G.sp || G.gauge < CONFIG.GAUGE_MAX) return;
  G.gauge = 0;
  var id; do { id = Math.floor(Math.random() * SPECIALS.length); } while (id === G.lastSp);
  var spo = hashOpt('sp'); if (spo) id = clamp(spo - 1, 0, 9);
  G.lastSp = id;
  var pts = [];
  for (var i = 0; i < 16; i++) { var p = proj(rnd(-0.9, 0.9), rnd(20, 650)); pts.push({ x: p.x, y: p.y, d: rnd(0, 0.3) }); }
  G.sp = { id: id, t: 0, dur: 2.4, struck: false, pts: pts };
  sfx('sp'); G.shake = 6;
}

/* ===== 出てくるもの ===== */
function makeCity() {
  var a = [], x = -20;
  while (x < 380) { var w = rnd(14, 34); a.push({ x: x, w: w, h: rnd(14, 60) }); x += w + rnd(0, 6); }
  return a;
}
function stageBanner() {
  var S = STAGES[G.stage];
  G.banner = { t: 0, dur: 2.6, big: 'STAGE ' + (G.loop * 10 + G.stage + 1), small: S.name + ' 〜' + S.title + '〜', col: '#ffe066' };
}
function speed() { return CONFIG.SPEED * (1 + G.stage * 0.035 + G.loop * 0.22); }
function spawnFoe(wx, z) {
  var S = STAGES[G.stage];
  G.objs.push({ k: 'foe', wx: wx, z: z || CONFIG.ZFAR, f: pick(S.foes), ph: rnd(0, 6), say: Math.random() < 0.45, walk: rnd(20, 70), sway: rnd(-0.15, 0.15) });
}
function spawnHaz(wx, z, thrown) {
  var S = STAGES[G.stage];
  G.objs.push({ k: 'haz', wx: wx, z: z || CONFIG.ZFAR, h: pick(S.haz), rot: rnd(-0.5, 0.5), thrown: !!thrown, hop: 0 });
}
function spawnDeco() {
  var S = STAGES[G.stage];
  [-1, 1].forEach(function (side) { G.objs.push({ k: 'deco', wx: side * rnd(1.5, 2.0), z: CONFIG.ZFAR + rnd(0, 40), e: pick(S.deco), sz: rnd(70, 95) }); });
}
function startBoss() {
  var S = STAGES[G.stage], lv = G.stage + G.loop * 10;
  G.phase = 'boss'; G.phaseT = 0;
  G.boss = { d: S.boss, wx: 0, z: CONFIG.ZFAR, hp: 0, max: 16 + lv * 3, t: 0, throwT: 2.5, flashT: 0, in: false, dying: 0 };
  G.boss.hp = G.boss.max;
  G.banner = { t: 0, dur: 2.4, big: 'ボス あらわる!', small: S.boss.name, col: '#ff5a5a' };

/* ===== こらしめる ===== */
function addScore(n) { G.score += Math.round(n); }
function knock(o, byCane) {          // 悪者を 空のかなたへ ぶっとばす
  o.dead = true;
  var p = proj(o.wx, o.z);
  G.combo++; G.comboT = 2.2; if (G.combo > G.maxCombo) G.maxCombo = G.combo; G.killed++;
  addScore((byCane ? 100 : 50) * (1 + Math.floor(G.combo / 5) * 0.5) * (1 + G.loop));
  if (!G.sp) G.gauge = Math.min(CONFIG.GAUGE_MAX, G.gauge + (byCane ? 8 : 4));
  var dir = (o.wx - G.px) || rnd(-0.3, 0.3);
  G.fly.push({ x: p.x, y: p.y - 30 * p.s, vx: dir * 900 + rnd(-120, 120), vy: -rnd(900, 1300), r: 0, vr: rnd(-18, 18), sz: 52 * p.s + 10, f: o.f });
  G.fx.push({ k: 'word', x: p.x, y: p.y - 60 * p.s, s: pick(HIT_WORDS), t: 0, dur: 0.6, col: byCane ? '#fff36b' : '#ffffff' });
  for (var i = 0; i < 10; i++) G.fx.push({ k: 'spark', x: p.x, y: p.y - 30 * p.s, vx: rnd(-320, 320), vy: rnd(-380, 120), t: 0, dur: rnd(0.3, 0.55), col: pick(['#fff', '#ffe066', '#ff8a3d']), r: rnd(2, 5) });
  G.fx.push({ k: 'ring', x: p.x, y: p.y - 30 * p.s, t: 0, dur: 0.3, r: 50 * p.s + 10 });
  G.shake = Math.max(G.shake, byCane ? 6 : 3);
  sfx(byCane ? 'hit' : 'bonk');
}
function hitBoss(n) {
  var b = G.boss; if (!b || b.dying) return;
  b.hp -= n; b.flashT = 0.15; b.z = Math.min(b.z + 35 * Math.min(n, 3), 320);
  var p = proj(b.wx, b.z);
  addScore(80 * n * (1 + G.loop)); if (!G.sp) G.gauge = Math.min(CONFIG.GAUGE_MAX, G.gauge + 5);
  G.combo++; G.comboT = 2.2; if (G.combo > G.maxCombo) G.maxCombo = G.combo;
  G.fx.push({ k: 'word', x: p.x + rnd(-30, 30), y: p.y - 120 * p.s, s: n > 1 ? 'ドッカーン!' : pick(HIT_WORDS), t: 0, dur: 0.6, col: '#ff8a8a' });
  for (var i = 0; i < 14; i++) G.fx.push({ k: 'spark', x: p.x, y: p.y - 70 * p.s, vx: rnd(-400, 400), vy: rnd(-450, 150), t: 0, dur: rnd(0.3, 0.6), col: pick(['#fff', '#ffe066', '#ff5a5a']), r: rnd(2, 6) });
  G.shake = Math.max(G.shake, 9); sfx('boss');
  if (b.hp <= 0) bossDie();
}
function bossDie() {
  var b = G.boss, p = proj(b.wx, b.z), lv = G.stage + G.loop * 10;
  b.dying = 0.01; b.hp = 0;
  addScore(3000 * (lv + 1));
  G.fly.push({ x: p.x, y: p.y - 80 * p.s, vx: rnd(-200, 200), vy: -1400, r: 0, vr: 14, sz: 130 * p.s + 30, f: b.d, boss: true });
  for (var i = 0; i < 40; i++) G.fx.push({ k: 'spark', x: p.x, y: p.y - 80 * p.s, vx: rnd(-700, 700), vy: rnd(-700, 400), t: 0, dur: rnd(0.5, 1.1), col: pick(['#fff', '#ffe066', '#ff5a5a', '#7fe0ff']), r: rnd(3, 8) });
  G.fx.push({ k: 'emo', e: '💥', x: p.x, y: p.y - 80 * p.s, t: 0, dur: 0.7, sz: 180 });
  G.flash = 1; G.shake = 22; G.hitstop = 0.25;
  G.phase = 'clear'; G.phaseT = 0; G.boss = null;
  G.banner = { t: 0, dur: 2.4, big: '成敗!', small: STAGES[G.stage].boss.name + ' を こらしめた!  +' + 3000 * (lv + 1), col: '#ffe066' };
  G.objs.forEach(function (o) { if (o.k === 'haz') o.gone = true; });
  sfx('clear');
}
function nextStage() {
  G.stage++;
  if (G.stage >= STAGES.length) {
    G.stage = 0; G.loop++;
    G.banner = { t: 0, dur: 3.0, big: '地球の平和は守られた!', small: (G.loop + 1) + '周目へ 〜もっと速くなるよ〜', col: '#7fe0ff' };
    setTimeout(function () { if (G.state === 'play') stageBanner(); }, 3200);
  } else stageBanner();
  G.phase = 'run'; G.phaseT = 0; G.city = makeCity(); G.flash = 0.8;
  G.objs = G.objs.filter(function (o) { return o.k !== 'deco'; });
  for (var z = 60; z < CONFIG.ZFAR; z += 70) {
    var S = STAGES[G.stage];
    [-1, 1].forEach(function (side) { G.objs.push({ k: 'deco', wx: side * rnd(1.5, 2.0), z: z + rnd(0, 30), e: pick(S.deco), sz: rnd(70, 95) }); });
  }
}
function scold() {
  if (G.scoldT > 0) return;
  G.say = { s: pick(STAGES[G.stage].scold), t: 0 }; G.scoldT = 1.4;
}
function trip(o) {                   // つまずいた!(おしまい)
  G.state = 'trip'; G.trip = { n: o.h.n, e: o.h.e, t: 0 };
  G.shake = 14; sfx('trip');
  document.getElementById('pad').classList.add('hidden'); document.getElementById('tools').classList.add('hidden');
}

/* ===== 1コマぶん 進める ===== */
function update(dt) {
  if (G.state === 'trip') {
    G.trip.t += dt; updFx(dt * 0.6);
    if (G.trip.t > 1.7) finish();
    return;
  }
  G.t += dt;
  if (G.banner) { G.banner.t += dt; if (G.banner.t > G.banner.dur) G.banner = null; }
  G.flash = Math.max(0, G.flash - dt * 2.5); G.shake = Math.max(0, G.shake - dt * 40);
  if (G.hitstop > 0) { G.hitstop -= dt; updFx(dt * 0.3); return; }

  var spd = speed() * (G.sp ? 0.35 : 1) * (G.phase === 'clear' ? 0.6 : 1);
  G.dist += spd * dt;

  // おばあ
  if (keys.ArrowLeft || keys.a) G.px -= 1.9 * dt;
  if (keys.ArrowRight || keys.d) G.px += 1.9 * dt;
  G.px = clamp(G.px, -0.88, 0.88);
  if (G.jh > 0) { G.vy -= CONFIG.GRAV * dt; G.jh += G.vy * dt; if (G.jh <= 0) { G.jh = 0; G.vy = 0; } }
  G.atkT -= dt; G.atkCd -= dt; G.inv -= dt; G.scoldT -= dt;
  G.comboT -= dt; if (G.comboT <= 0) G.combo = 0;
  if (G.say) { G.say.t += dt; if (G.say.t > 1.3) G.say = null; }

  // ステージの流れ
  var lv = G.stage + G.loop * 10;
  G.phaseT += dt;
  if (G.phase === 'run') {
    if (G.phaseT > CONFIG.STAGE_TIME) startBoss();
  } else if (G.phase === 'clear') {
    if (G.phaseT > 2.6) nextStage();
  }
  if (!G.sp && G.phase !== 'clear') {
    G.foeT -= dt;
    if (G.foeT <= 0) {
      var r = Math.random();
      if (r < 0.22 + lv * 0.01) {                 // 集団(横一列でまとめて来る。まとめてぶっとばすと爽快)
        var n = 3 + Math.floor(Math.random() * (2 + Math.min(lv, 4) / 2)), w = rnd(0.9, 1.6), c = rnd(-0.85 + w / 2, 0.85 - w / 2);
        for (var i = 0; i < n; i++) spawnFoe(c - w / 2 + w * i / (n - 1), CONFIG.ZFAR + rnd(0, 30));
      } else spawnFoe(rnd(-0.8, 0.8));
      G.foeT = Math.max(0.42, (G.phase === 'boss' ? 1.6 : 0.95) - lv * 0.035) * rnd(0.7, 1.3);
    }
    G.hazT -= dt;
    if (G.hazT <= 0) {
      if (G.t > 4) spawnHaz(rnd(-0.8, 0.8));
      if (lv >= 4 && Math.random() < 0.18 + lv * 0.01) spawnHaz(rnd(-0.8, 0.8), CONFIG.ZFAR + rnd(140, 220));
      G.hazT = Math.max(0.85, 2.1 - lv * 0.1) * rnd(0.8, 1.25) * (G.phase === 'boss' ? 1.6 : 1);
    }
  }
  G.decoD += spd * dt;
  if (G.decoD > 70) { G.decoD = 0; spawnDeco(); }

  // ボス
  var b = G.boss;
  if (b) {
    b.t += dt; b.flashT -= dt;
    var targetZ = 165 + Math.sin(b.t * 0.9) * 75;
    if (!b.in) { b.z -= 500 * dt; if (b.z <= targetZ) b.in = true; }
    else b.z += (targetZ - b.z) * Math.min(1, dt * 2.2);
    b.wx = Math.sin(b.t * 0.7) * 0.6 + Math.sin(b.t * 1.9) * 0.15;
    if (b.in && !G.sp) {
      b.throwT -= dt;
      if (b.throwT <= 0) {               // ボスは つまずくものを投げてくる
        var aim = b.wx + (G.px - b.wx) * rnd(0.3, 0.9);
        spawnHaz(clamp(aim, -0.85, 0.85), b.z - 20, true);
        if (lv >= 3 && Math.random() < 0.35) spawnHaz(clamp(aim + pick([-0.45, 0.45]), -0.85, 0.85), b.z + 40, true);
        b.throwT = Math.max(1.0, 2.6 - lv * 0.12) * rnd(0.8, 1.2);
      }
    }
  }

  // 動かす・ぶつかり
  for (var k = 0; k < G.objs.length; k++) {
    var o = G.objs[k];
    if (o.k === 'foe') { o.z -= (spd + o.walk) * dt; o.wx = clamp(o.wx + o.sway * dt, -0.9, 0.9); }
    else if (o.k === 'haz') { o.z -= (spd + (o.thrown ? 160 : 0)) * dt; if (o.thrown) o.hop += dt; }
    else o.z -= spd * dt;
    if (o.dead || o.gone) continue;
    if (o.k === 'foe' && o.z < 16 && o.z > -12 && Math.abs(o.wx - G.px) < 0.24 && G.jh < 50) knock(o, false);   // 体当たりでも はじき飛ばす(おばあは最強)
    if (o.k === 'haz' && o.z < 11 && o.z > -9 && Math.abs(o.wx - G.px) < 0.17 && G.jh < 16 && !G.sp && G.inv <= 0 && !G.god) { trip(o); return; }
  }
  G.objs = G.objs.filter(function (o) { return !o.dead && !o.gone && o.z > -90; });

  // 必殺技
  if (G.sp) {
    var sp = G.sp; sp.t += dt;
    if (!sp.struck && sp.t >= 0.8) { sp.struck = true; strike(); }
    if (sp.t >= sp.dur) { G.sp = null; G.inv = 0.8; }
  }
  updFx(dt);
  if (G.auto) autoPlay();
}
function strike() {                  // 必殺技が 当たった瞬間: 画面の悪者を全部ぶっとばす
  G.objs.forEach(function (o) {
    if (o.k === 'foe' && !o.dead && o.z < CONFIG.ZFAR) knock(o, true);
    if (o.k === 'haz') {
      o.gone = true; var p = proj(o.wx, o.z);
      G.fx.push({ k: 'emo', e: '💨', x: p.x, y: p.y - 10, t: 0, dur: 0.5, sz: 40 * p.s + 10 });
    }
  });
  if (G.boss && !G.boss.dying) hitBoss(Math.ceil(G.boss.max * 0.36));
  G.flash = 1; G.shake = 24; G.hitstop = 0.12;
  addScore(1000 * (1 + G.loop));
}
function updFx(dt) {
  G.fly.forEach(function (f) {
    f.x += f.vx * dt; f.y += f.vy * dt; f.vy += 500 * dt; f.r += f.vr * dt; f.sz *= (1 - dt * 0.6);
    if (f.y < -30 && !f.done) {
      f.done = true;
      if (G.fx.filter(function (e) { return e.k === 'kira'; }).length < 3) { sfx('kira'); G.fx.push({ k: 'kira', x: clamp(f.x, 30, 330), y: 40 + rnd(0, 50), t: 0, dur: 0.8 }); }
    }
  });
  G.fly = G.fly.filter(function (f) { return !f.done && f.y < H + 100; });
  G.fx.forEach(function (e) { e.t += dt; if (e.vx != null) { e.x += e.vx * dt; e.y += e.vy * dt; e.vy += 700 * dt; } });
  G.fx = G.fx.filter(function (e) { return e.t < e.dur; });
  if (G.fx.length > 260) G.fx.splice(0, G.fx.length - 260);
}
function autoPlay() {                // 自動で遊ぶ(画面の写真をとるため。#auto のとき)
  var near = null;
  G.objs.forEach(function (o) {
    if (o.k === 'haz' && o.z > 0 && o.z < 70 && Math.abs(o.wx - G.px) < 0.24) near = o;
  });
  if (near) doJump();
  var tgt = null, best = 1e9;
  G.objs.forEach(function (o) { if (o.k === 'foe' && o.z > 40 && o.z < 400 && o.z < best) { best = o.z; tgt = o; } });
  if (G.boss) tgt = G.boss;
  if (tgt) G.px += clamp(tgt.wx - G.px, -1, 1) * 0.04;
  if (G.objs.some(function (o) { return o.k === 'foe' && o.z > 0 && o.z < 90 && Math.abs(o.wx - G.px) < 0.5; }) || (G.boss && G.boss.z < 170)) doAttack();
  if (G.gauge >= CONFIG.GAUGE_MAX && Math.random() < 0.02) doSpecial();
}

/* ===== 描く ===== */
function draw() {
  var S = STAGES[G.stage || 0];
  ctx.save();
  ctx.fillStyle = '#140c2a'; ctx.fillRect(-OX - 10, -10, CONFIG.W + OX * 2 + 20, H + 20);
  if (G.state === 'title' || !G.objs) { drawTitleBg(); ctx.restore(); return; }
  if (G.shake > 0) ctx.translate(rnd(-G.shake, G.shake) * 0.6, rnd(-G.shake, G.shake) * 0.6);
  var sp = G.sp;
  if (sp && sp.id === 8) {           // ちゃぶ台返し: 世界ごと ひっくり返す
    var a = clamp((sp.t - 0.35) / 1.1, 0, 1); a = a * a * (3 - 2 * a);
    ctx.translate(180, H / 2); ctx.rotate(a * Math.PI * 2); ctx.translate(-180, -H / 2);
  }
  drawWorld(S);
  ctx.restore();
  ctx.save();
  if (sp) drawSpecial(sp);
  drawFx();
  drawHud(S);
  if (G.flash > 0) { ctx.fillStyle = 'rgba(255,255,255,' + G.flash * 0.75 + ')'; ctx.fillRect(-OX, 0, CONFIG.W + OX * 2, H); }
  ctx.restore();
}
function drawTitleBg() {
  var g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#5fb6ff'); g.addColorStop(1, '#ffe7b8');
  ctx.fillStyle = g; ctx.fillRect(-OX, 0, CONFIG.W + OX * 2, H);
}
function drawWorld(S) {
  var L = -OX - 20, R = CONFIG.W + OX + 20;
  // 空
  var g = ctx.createLinearGradient(0, 0, 0, HY); g.addColorStop(0, S.sky[0]); g.addColorStop(1, S.sky[1]);
  ctx.fillStyle = g; ctx.fillRect(L, -40, R - L, HY + 41);
  if (S.night) { ctx.fillStyle = '#fff'; for (var i = 0; i < 40; i++) { ctx.globalAlpha = 0.4 + 0.6 * Math.abs(Math.sin(G.t * 2 + i)); ctx.fillRect((i * 97) % 380 - 10, (i * 53) % (HY - 20), 2, 2); } ctx.globalAlpha = 1; }
  emo(S.sun, 290, HY * 0.38, S.space ? 70 : 52);
  // 遠くの街なみ
  ctx.fillStyle = S.city;
  G.city.forEach(function (c) { ctx.fillRect(c.x, HY - c.h, c.w, c.h + 1); });
  if (S.night) { ctx.fillStyle = 'rgba(255,220,120,.7)'; G.city.forEach(function (c, i) { if (i % 2) ctx.fillRect(c.x + 4, HY - c.h + 6, 3, 3); }); }
  ctx.fillStyle = S.side[0]; ctx.fillRect(L, HY, R - L, H - HY);
  // 道(手前ほど広く・しま模様が流れて 進んでいる感じ)
  var seg = 45, z0 = -100, f1 = proj(0, 9000), f2 = proj(0, CONFIG.ZFAR + 50);   // まず 地平線までの遠い道
  ctx.fillStyle = S.road[0]; ctx.beginPath(); ctx.moveTo(180 - CONFIG.ROADW * f1.s * 1.2, f1.y); ctx.lineTo(180 + CONFIG.ROADW * f1.s * 1.2, f1.y);
  ctx.lineTo(180 + CONFIG.ROADW * f2.s * 1.2, f2.y + 1); ctx.lineTo(180 - CONFIG.ROADW * f2.s * 1.2, f2.y + 1); ctx.fill();
  for (var z = CONFIG.ZFAR + 50; z > z0; z -= seg) {
    var z1 = Math.max(z - seg, z0), a = proj(0, z), b = proj(0, z1);
    var band = Math.floor((z + G.dist) / seg) % 2 === 0;
    var ya = a.y, yb = b.y, wa = CONFIG.ROADW * a.s, wb = CONFIG.ROADW * b.s;
    ctx.fillStyle = band ? S.side[0] : S.side[1];
    ctx.fillRect(L, ya, R - L, yb - ya + 1);
    ctx.fillStyle = band ? S.road[0] : S.road[1];
    ctx.beginPath(); ctx.moveTo(180 - wa * 1.12, ya); ctx.lineTo(180 + wa * 1.12, ya); ctx.lineTo(180 + wb * 1.12, yb + 1); ctx.lineTo(180 - wb * 1.12, yb + 1); ctx.fill();
    ctx.fillStyle = band ? '#fff' : (S.space ? '#ff4fd8' : '#e0453a');   // 道のふち
    ctx.beginPath(); ctx.moveTo(180 - wa * 1.12, ya); ctx.lineTo(180 - wa * 1.2, ya); ctx.lineTo(180 - wb * 1.2, yb + 1); ctx.lineTo(180 - wb * 1.12, yb + 1); ctx.fill();
    ctx.beginPath(); ctx.moveTo(180 + wa * 1.12, ya); ctx.lineTo(180 + wa * 1.2, ya); ctx.lineTo(180 + wb * 1.2, yb + 1); ctx.lineTo(180 + wb * 1.12, yb + 1); ctx.fill();
    if (band) {                       // まんなかの線
      ctx.fillStyle = 'rgba(255,255,255,.8)';
      ctx.beginPath(); ctx.moveTo(180 - wa * 0.025, ya); ctx.lineTo(180 + wa * 0.025, ya); ctx.lineTo(180 + wb * 0.025, yb); ctx.lineTo(180 - wb * 0.025, yb); ctx.fill();
    }
  }
  // 地平線のかすみ(奥行き)
  var hz = ctx.createLinearGradient(0, HY, 0, HY + 40); hz.addColorStop(0, S.sky[1]); hz.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.globalAlpha = 0.55; ctx.fillStyle = S.sky[1]; ctx.fillStyle = hz; ctx.fillRect(L, HY, R - L, 40); ctx.globalAlpha = 1;
  // 奥から順に描く(手前のものが上に重なる)
  var list = G.objs.slice();
  if (G.boss) list.push({ k: 'boss', z: G.boss.z });
  list.push({ k: 'me', z: 0 });
  list.sort(function (a, b) { return b.z - a.z; });
  list.forEach(function (o) {
    if (o.k === 'deco') drawDeco(o);
    else if (o.k === 'foe') drawFoe(o);
    else if (o.k === 'haz') drawHaz(o);
    else if (o.k === 'boss') drawBoss(G.boss);
    else if (o.k === 'me') drawObaa();
  });
  // ぶっとんでいく悪者
  G.fly.forEach(function (f) { drawPerson(f.x, f.y + f.sz * 0.5, f.sz, f.f, 0, f.r, f.boss); });
}
function drawDeco(o) {
  var p = proj(o.wx, o.z); if (p.y < HY - 2) return;
  var sz = o.sz * p.s; shadow(p.x, p.y, sz * 0.4, sz * 0.1, 0.18);
  emo(o.e, p.x, p.y - sz * 0.45, sz);
}
function drawPerson(x, y, sz, f, bob, rot, boss) {   // 胴体と足は図形で、顔は絵文字で
  ctx.save(); ctx.translate(x, y); if (rot) ctx.rotate(rot);
  if (f.ufo) {
    emo('👽', 0, -sz * 0.95, sz * 0.55);
    emo('🛸', 0, -sz * 0.5, sz * 1.25);
    ctx.restore(); return;
  }
  var leg = Math.sin(G.t * 14 + (bob || 0)) * sz * 0.08;
  ctx.strokeStyle = '#222'; ctx.lineWidth = Math.max(1.5, sz * 0.09); ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-sz * 0.1, -sz * 0.32); ctx.lineTo(-sz * 0.12 + leg, 0); ctx.moveTo(sz * 0.1, -sz * 0.32); ctx.lineTo(sz * 0.12 - leg, 0); ctx.stroke();
  ctx.fillStyle = f.c; rrect(-sz * 0.24, -sz * 0.72, sz * 0.48, sz * 0.46, sz * 0.12); ctx.fill();
  emo(f.e, 0, -sz * 0.92, sz * 0.62);
  if (f.p) emo(f.p, sz * 0.3, -sz * 0.6, sz * 0.36, Math.sin(G.t * 5 + (bob || 0)) * 0.25);
  ctx.restore();
}
function drawFoe(o) {
  var p = proj(o.wx, o.z); if (p.y < HY - 4) return;
  var sz = 66 * p.s, bob = Math.abs(Math.sin(G.t * 9 + o.ph)) * 3 * p.s;
  shadow(p.x, p.y, sz * 0.32, sz * 0.09);
  drawPerson(p.x, p.y - bob, sz, o.f, o.ph);
  if (o.say && o.z < 560 && o.z > 110) bubble(o.f.say, p.x, p.y - sz * 1.42, clamp(13 * p.s + 3, 8, 14));
}
function drawHaz(o) {
  var p = proj(o.wx, o.z); if (p.y < HY - 2) return;
  var sz = 30 * p.s + 3, hop = o.thrown ? Math.abs(Math.sin(o.hop * 9)) * 22 * p.s : 0;
  shadow(p.x, p.y, sz * 0.5, sz * 0.15, 0.35);
  if (o.z < 420) {                     // 近づいてきたら 赤い輪で知らせる(見落とさないように)
    ctx.strokeStyle = 'rgba(255,60,60,' + (0.5 + 0.5 * Math.sin(G.t * 14)) + ')'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(p.x, p.y, sz * 0.75, sz * 0.25, 0, 0, 6.283); ctx.stroke();
  }
  emo(o.h.e, p.x, p.y - sz * 0.38 - hop, sz, o.rot + (o.thrown ? o.hop * 8 : 0));
}
function drawBoss(b) {
  var p = proj(b.wx, b.z), sz = 215 * p.s;
  // オーラ
  var r = sz * (0.75 + 0.06 * Math.sin(G.t * 8));
  var g = ctx.createRadialGradient(p.x, p.y - sz * 0.6, 0, p.x, p.y - sz * 0.6, r);
  g.addColorStop(0, 'rgba(255,40,80,.45)'); g.addColorStop(1, 'rgba(255,40,80,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y - sz * 0.6, r, 0, 6.283); ctx.fill();
  shadow(p.x, p.y, sz * 0.38, sz * 0.1, 0.4);
  if (b.flashT > 0) { ctx.save(); ctx.globalAlpha = 0.6; }
  drawPerson(p.x, p.y - (b.d.ufo ? sz * 0.25 + Math.sin(G.t * 3) * 8 : 0), sz, b.d, 0, Math.sin(G.t * 3) * 0.06);
  if (b.flashT > 0) ctx.restore();
  if (b.in && b.z < 175 && !G.sp) txt('いまだ!叩け!', p.x, p.y - sz * 1.35, 16, '#fff36b');
  else if (b.in && Math.sin(G.t * 1.3) > 0.6) bubble(b.d.say, p.x, p.y - sz * 1.3, 12);
}
function drawObaa() {
  var p = proj(G.px, 0), x = p.x, y = BY - G.jh;
  shadow(x, BY + 2, 30 - Math.min(G.jh, 60) * 0.15, 8, 0.35);
  var gold = G.sp && G.sp.id === 9, spin = G.sp && G.sp.id === 1 ? G.sp.t * 25 : 0;
  ctx.save(); ctx.translate(x, y);
  if (G.state === 'trip') {           // つまずいて ころぶ
    var tt = Math.min(G.trip.t / 0.45, 1);
    ctx.translate(0, -Math.sin(tt * Math.PI) * 40 + tt * 6); ctx.rotate(-tt * 1.6);
  }
  if (spin) ctx.scale(Math.cos(spin), 1);
  if (gold) { ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 30; }
  if (G.inv > 0 && Math.floor(G.t * 20) % 2) ctx.globalAlpha = 0.6;
  // 足
  var walk = G.jh > 0 ? 0 : Math.sin(G.t * 16) * 5;
  ctx.strokeStyle = '#3a2a2a'; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-7, -18); ctx.lineTo(-8 + walk, 0); ctx.moveTo(7, -18); ctx.lineTo(8 - walk, 0); ctx.stroke();
  // 着物
  ctx.fillStyle = gold ? '#ffd700' : '#7a3fa0';
  ctx.beginPath(); ctx.moveTo(-22, -16); ctx.lineTo(22, -16); ctx.lineTo(16, -54); ctx.lineTo(-16, -54); ctx.closePath(); ctx.fill();
  ctx.fillStyle = gold ? '#fff2a0' : '#f2c14e'; ctx.fillRect(-18, -38, 36, 7);   // 帯
  // 杖
  var sw = G.atkT > 0 ? (1 - G.atkT / 0.24) : -1;
  ctx.save(); ctx.translate(18, -40);
  var ang = sw >= 0 ? (-2.4 + sw * 3.0) : 0.25;
  ctx.rotate(ang);
  ctx.strokeStyle = '#8a5a2b'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(0, -6); ctx.lineTo(0, 48); ctx.stroke();
  ctx.strokeStyle = '#5a3a1b'; ctx.lineWidth = 7; ctx.beginPath(); ctx.arc(-6, -6, 6, 0, Math.PI, true); ctx.stroke();
  ctx.restore();
  emo('👵', 0, -74, 46);
  ctx.restore();
  // 杖のひとふり(当たる範囲を見せる)
  if (G.atkT > 0) {
    var k = G.atkT / 0.24, far = proj(G.px, CONFIG.ATK_REACH);
    ctx.save(); ctx.globalAlpha = k;
    ctx.strokeStyle = '#fff8c0'; ctx.lineWidth = 10 * k + 2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.ellipse(x, y - 60, CONFIG.ROADW * CONFIG.ATK_WIDE * 0.95, Math.max(10, (BY - 60 - far.y) * 0.9 + 10), 0, Math.PI * (1.05 + (1 - k) * 0.2), Math.PI * (1.95 - (1 - k) * 0.2)); ctx.stroke();
    ctx.restore();
  }
  if (G.say) { var a = Math.min(1, (1.3 - G.say.t) * 4); ctx.save(); ctx.globalAlpha = a; bubble(G.say.s, clamp(x, 80, 280), y - 118, 15); ctx.restore(); }
}
function drawFx() {
  G.fx.forEach(function (e) {
    var k = e.t / e.dur;
    if (e.k === 'spark') { ctx.fillStyle = e.col; ctx.globalAlpha = 1 - k; ctx.beginPath(); ctx.arc(e.x, e.y, e.r * (1 - k * 0.5), 0, 6.283); ctx.fill(); ctx.globalAlpha = 1; }
    else if (e.k === 'ring') { ctx.strokeStyle = 'rgba(255,255,255,' + (1 - k) + ')'; ctx.lineWidth = 4 * (1 - k) + 1; ctx.beginPath(); ctx.arc(e.x, e.y, e.r * (0.3 + k), 0, 6.283); ctx.stroke(); }
    else if (e.k === 'word') { var s = k < 0.15 ? 0.6 + k * 4 : 1.2 - k * 0.3; ctx.globalAlpha = 1 - Math.max(0, k - 0.6) * 2.5; txt(e.s, e.x, e.y - k * 30, 26 * s, e.col, '#c0122f'); ctx.globalAlpha = 1; }
    else if (e.k === 'emo') emo(e.e, e.x, e.y, e.sz * (0.6 + k * 0.8), 0, 1 - k);
    else if (e.k === 'kira') {        // キラーン!
