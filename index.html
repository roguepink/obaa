<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<meta name="description" content="全100ステージ。歩きスマホも詐欺も宇宙人も、杖と投げる物でこらしめる!でも小石につまずいたら終わり。LINEで開いてすぐ遊べる爽快ゲーム。">

<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">

<meta property="og:description" content="歩きスマホも詐欺も宇宙人も、杖ひとつでこらしめる!でも小石につまずいたら終わり。LINEで開いてすぐ遊べる爽快ゲーム。">

<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #140c2a; color: #fff;
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", "Noto Sans JP", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; text-align: center; padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom); background: rgba(10, 6, 24, .78); z-index: 5; }
  .overlay.hidden { display: none; }
  h1 { margin: 0; font-size: clamp(30px, 9vw, 50px); font-weight: 900; line-height: 1.2; text-shadow: 0 4px 0 #6b1d6b; }
  h1 small { display: block; font-size: .45em; color: #ffe066; text-shadow: none; margin-top: 6px; }
  p { margin: 0; line-height: 1.7; }
  .big { font-size: 84px; line-height: 1; filter: drop-shadow(0 6px 0 rgba(0,0,0,.35)); animation: bob 1s ease-in-out infinite alternate; }
  @keyframes bob { from { transform: translateY(0) rotate(-6deg); } to { transform: translateY(-10px) rotate(6deg); } }
  .rules { font-size: 15px; background: rgba(255,255,255,.08); border-radius: 14px; padding: 10px 14px; text-align: left; max-width: 340px; }
  .rules b { color: #ffe066; }
  .how { background: rgba(255,255,255,.08); border-radius: 14px; padding: 8px 12px 10px; text-align: left; max-width: 340px; width: 100%; font-size: 14px; }
  .how-t { font-weight: 900; color: #ffe066; text-align: center; margin-bottom: 4px; }
  .how-r { display: flex; align-items: center; gap: 10px; padding: 5px 0; border-top: 1px dashed rgba(255,255,255,.15); }
  .how-r:nth-child(2) { border-top: 0; }
  .how-r p { margin: 0; line-height: 1.45; }
  .how-r b { color: #ffe066; }
  .how-r.jump2 { flex-direction: column; align-items: flex-start; gap: 4px; background: rgba(127,224,255,.12); border-radius: 10px; padding: 6px 8px; border-top: 0; margin: 2px 0; }
  .mini { flex: none; display: inline-flex; align-items: center; justify-content: center; min-width: 58px; height: 30px; padding: 0 6px; border-radius: 9px;
    border: 2px solid #1b1430; box-shadow: 0 3px 0 #1b1430; color: #1b1430; font-weight: 900; font-size: 13px; }
  .mini2 { display: flex; align-items: center; gap: 6px; } .mini2 i { font-style: normal; font-weight: 900; color: #fff36b; }
  #bJump.air { background: #fff36b; animation: ready .35s ease-in-out infinite alternate; }
  #bJump.used { background: #b8c8d8; }
  #jLabel small { font-size: 10px; line-height: 1.2; }
  button { font: inherit; font-weight: 800; font-size: 20px; padding: 14px 36px; border: 3px solid #1b1430; border-radius: 999px;
    background: #ffe066; color: #1b1430; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  #pad { position: fixed; left: 0; right: 0; bottom: 0; padding: 0 10px calc(env(safe-area-inset-bottom) + 12px); display: flex;
    gap: 10px; align-items: flex-end; justify-content: space-between; z-index: 3; pointer-events: none; }
  #pad.hidden, #tools.hidden { display: none; }
  .pb { pointer-events: auto; position: relative; overflow: hidden; width: 104px; height: 84px; padding: 0; border-radius: 22px;
    font-size: 19px; line-height: 1.15; border: 3px solid #1b1430; box-shadow: 0 5px 0 #1b1430; color: #1b1430; }
  .pb:active, .pb.on { transform: translateY(4px); box-shadow: 0 1px 0 #1b1430; }
  #bJump { background: #7fe0ff; }
  #bAtk { background: #ffb347; font-size: 22px; }
  #bAtk small, #bJump small { display: block; font-size: 11px; font-weight: 700; }
  #bSp { width: 112px; height: 96px; border-radius: 50%; background: #3a2d55; color: #aaa; font-size: 20px; }
  #bSp b { position: relative; z-index: 1; }
  #spFill { position: absolute; left: 0; right: 0; bottom: 0; height: 0%; background: linear-gradient(#ff4fd8, #ff8a00); }
  #bSp.ready { color: #fff; animation: ready .5s ease-in-out infinite alternate; text-shadow: 0 2px 0 #1b1430; }
  #bSp.ready #spFill { background: linear-gradient(#fff36b, #ff3d7f, #8a2be2); }
  @keyframes ready { from { box-shadow: 0 5px 0 #1b1430, 0 0 0 0 #fff36b; } to { box-shadow: 0 5px 0 #1b1430, 0 0 24px 8px #fff36b; } }
  #tools { position: fixed; top: calc(env(safe-area-inset-top) + 6px); right: 6px; display: flex; gap: 6px; z-index: 3; }
  #tools button { width: 42px; height: 42px; padding: 0; font-size: 20px; background: rgba(255,255,255,.85); border-width: 2px; }
  #diffs { display: flex; gap: 8px; width: 100%; max-width: 340px; }
  #diffs button { flex: 1; min-width: 0; font-size: 15px; padding: 8px 4px; border-radius: 14px; background: #3a2d55; color: #fff; border-color: #6a5a8a; line-height: 1.3; white-space: nowrap; }
  #diffs button small { display: block; font-size: 10px; font-weight: 700; opacity: .85; }
  #diffs button.sel { background: #ffe066; color: #1b1430; border-color: #1b1430; box-shadow: 0 0 0 3px #ff7ad0; }
  #diffs button[data-d="easy"].sel { background: #9df29d; }
  #diffs button[data-d="hard"].sel { background: #ff8a8a; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  button.sub { background: #7fe0ff; }
  .hidden { display: none !important; }
  #bAtk .we { position: absolute; top: 4px; left: 6px; font-size: 22px; }
  #bAtk small { font-size: 10px; }
  .overlay { overflow-y: auto; justify-content: flex-start; padding-top: calc(env(safe-area-inset-top) + 16px); padding-bottom: calc(env(safe-area-inset-bottom) + 16px); }
  .overlay > :first-child { margin-top: auto; } .overlay > :last-child { margin-bottom: auto; }
  @media (max-height: 640px), (max-width: 340px) {
    .overlay { gap: 8px; padding-left: 12px; padding-right: 12px; } .big { font-size: 54px; } h1 { font-size: 28px; }
    #title .big { display: none; } .how-r { padding: 3px 0; }
    .rules, .how { font-size: 12px; padding: 6px 9px; } .mini { min-width: 50px; height: 26px; font-size: 11px; } #diffs button { font-size: 14px; } button { font-size: 18px; padding: 11px 26px; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="pad" class="hidden">
  <button id="bJump" class="pb" type="button"><span id="jLabel">ジャンプ<small>空中でもう1回<br>→ 二段ジャンプ</small></span></button>
  <button id="bSp" class="pb" type="button"><span id="spFill"></span><b>必殺</b></button>
  <button id="bAtk" class="pb" type="button">杖</button>
</div>
<div id="tools" class="hidden"><button id="bMute" type="button" aria-label="音">🔊</button><button id="bPause" type="button" aria-label="ひとやすみ">⏸</button></div>
<div id="title" class="overlay">
  <div class="big">👵</div>
  <h1>最強おばあ<small>〜 杖でこらしめ道中 〜 全100ステージ</small></h1>
  <div id="diffs">
    <button type="button" data-d="easy">かんたん<small>3回まで<br>つまずいてOK</small></button>
    <button type="button" data-d="normal">ふつう<small>つまずいたら<br>おしまい</small></button>
    <button type="button" data-d="hard">むずかしい<small>速い・多い<br>ボスが強い</small></button>
  </div>
  <div class="how">
    <div class="how-t">あそびかた</div>
    <div class="how-r"><span class="mini" style="background:#e8e0ff">👆↔</span><p><b>指で左右になぞる</b>と、おばあが動く</p></div>
    <div class="how-r"><span class="mini" style="background:#ffb347">杖</span><p><b>押しっぱなし</b>で物を投げる。近くの悪者は杖でぶっとばす</p></div>
    <div class="how-r"><span class="mini" style="background:#7fe0ff">ジャンプ</span><p>小石・空き缶・バナナの皮は<b>ジャンプ</b>でよける。つまずくと終わり!</p></div>
    <div class="how-r jump2"><span class="mini2"><span class="mini" style="background:#7fe0ff">ジャンプ</span><i>→</i><span class="mini" style="background:#fff36b">もう1回!</span></span><p><b>空中でもう1回押す</b>と<b>二段ジャンプ</b>。もっと高くとべて、転がってくる大きな物もこえられる</p></div>
    <div class="how-r"><span class="mini" style="background:linear-gradient(#fff36b,#ff3d7f)">必殺</span><p>ゲージがたまったら押す。10種類から何が出るかはお楽しみ</p></div>
  </div>
  <p id="titleBest"></p>
  <div class="row"><button id="btnPlay" type="button">はじめから</button><button id="btnCont" type="button" class="sub hidden">つづきから</button></div>
</div>
<div id="pause" class="overlay hidden">
  <h1>ひとやすみ中</h1>
  <p>お茶でも飲んでね 🍵</p>
  <button id="btnResume" type="button">つづける</button>
</div>
<div id="over" class="overlay hidden">
  <div class="big" style="animation:none;transform:rotate(90deg)">👵</div>
  <h1>ずてーん!</h1>
  <p id="overWhy"></p>
  <p id="overStage" style="color:#ffe066;font-weight:800"></p>
  <p id="overScore" style="font-size:15px"></p>
  <p id="overBest" style="font-size:14px;opacity:.8"></p>
  <button id="btnAgain" type="button">やり直す</button>
  <button id="btnTitle" type="button" class="sub">タイトルへ</button>
</div>
<script src="js/data.js"></script>
<script src="js/game.js"></script>
<script>
// LINE の中で開いたときだけ、1回だけ案内する(LINE の中は画面が小さく、ホーム画面にも入れられない)
(function () {
  var seenKey = 'obaa-line-tip', seen = false;
  try { seen = localStorage.getItem(seenKey) === '1'; } catch (e) {}
  var standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  if (!/\bLine\//i.test(navigator.userAgent) || standalone || seen) return;
  var bar = document.createElement('div');
  bar.style.cssText = 'position:fixed;left:8px;right:8px;top:calc(56px + env(safe-area-inset-top,0px));z-index:99999;background:#fffaf0;color:#1b1430;border:3px solid #1b1430;border-radius:14px;padding:10px 40px 10px 12px;font:700 13px/1.5 system-ui,sans-serif';
  bar.textContent = 'LINEの中だと画面が小さめです。右下の「…」(または右上の︙)から「ブラウザで開く」を選ぶと、大きく遊べて、ホーム画面にも入れられます。';
  var x = document.createElement('button'); x.type = 'button'; x.setAttribute('aria-label', 'とじる'); x.textContent = '×';
  x.style.cssText = 'position:absolute;top:4px;right:6px;width:32px;height:32px;border:0;background:none;font:900 20px/1 system-ui;color:#1b1430;cursor:pointer;padding:0';
  x.addEventListener('click', function () { try { localStorage.setItem(seenKey, '1'); } catch (e) {} bar.remove(); });
  bar.appendChild(x); addEventListener('load', function () { document.body.appendChild(bar); });
})();
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>

    desc: '歩きスマホ、詐欺、あおり運転、カスハラ、闇バイト、ハッカー、戦争したがる将軍、そして宇宙人まで。最強のおばあが、杖と投げる物で、ぜんぶ空のかなたへぶっとばす!全100ステージ。ただし小石や空き缶につまずいたら、そこでおしまい。',
    points: ['全100ステージ。場所25種・悪者25種・ボスは100体', 'ボスには物を投げて攻撃。投げる物は10種類', '必殺技10種・かんたん/ふつう/むずかしいの3モード'],

</body>
